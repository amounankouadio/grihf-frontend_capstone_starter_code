<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO meta tags -->
    <title>StayHealthy | Book Medical Appointments Online</title>
    <meta
      name="description"
      content="StayHealthy lets you find certified doctors by speciality, book or cancel
               appointments online, read patient reviews and download your medical reports."
    />
    <meta
      name="keywords"
      content="medical appointment, book doctor online, healthcare, doctor consultation,
               patient reports, StayHealthy, instant consultation, doctor reviews"
    />
    <meta name="author" content="StayHealthy Inc." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://stayhealthy.example/" />

    <!-- Open Graph, used when the site is shared on social networks -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StayHealthy | Book Medical Appointments Online" />
    <meta
      property="og:description"
      content="Find a doctor by speciality and book your appointment in a few clicks."
    />
    <meta property="og:url" content="https://stayhealthy.example/" />
    <meta property="og:site_name" content="StayHealthy" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StayHealthy | Book Medical Appointments Online" />
    <meta
      name="twitter:description"
      content="Find a doctor by speciality and book your appointment in a few clicks."
    />

    <!-- Font Awesome for the navigation bar icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
