<!DOCTYPE html>
<!-- Following code has been commented with appropriate comments for your reference. -->
<html lang="en">
<head>
    <!-- Set the character encoding to UTF-8 -->
    <meta charset="UTF-8">
    <!-- Set the viewport for responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayHealthy | Navigation Bar</title>
    <!-- Link the external stylesheet for styling -->
    <link rel="stylesheet" href="./Navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <nav>
        <!-- Navigation logo section -->
        <div class="nav__logo">
          <!-- Link to the home page -->
          <a href="/">
            StayHealthy
            <!-- Insert an SVG icon of a doctor with a stethoscope -->
            <svg xmlns="http://www.w3.org/2000/svg" height="26" width="26" viewBox="0 0 1000 1000" style="fill:#3685fb">
                <title>Doctor With Stethoscope SVG icon</title>
                <g>
                    <g>
                        <!-- Head of the doctor -->
                        <path d="M499.8,10c91.7,0,166,74.3,166,166c0,91.7-74.3,166-166,166c-91.7,0-166-74.3-166-166C333.8,84.3,408.1,10,499.8,10z"></path>
                        <!-- Collar of the coat -->
                        <path d="M499.8,522.8c71.2,0,129.1-58.7,129.1-129.1H370.6C370.6,464.1,428.6,522.8,499.8,522.8z"></path>
                        <!-- Stethoscope and shoulders -->
                        <path d="M693.2,395c-0.7,94.9-70.3,173.7-160.8,188.9v155.9c0,80.3-60.7,150.8-140.8,155.3c-83,4.7-152.7-58.9-157.6-139.7c-22-12.8-35.6-38.5-30.3-66.7c4.7-25.1,25.5-45.6,50.8-49.9c39.7-6.7,74.1,23.7,74.1,62.1c0,23-12.3,43-30.7,54.1c4.7,45.4,45.1,80.4,92.6,76c44.6-4,77.2-44.4,77.2-89.2V583.9C377.1,568.7,307.5,489.9,306.8,395h-38.9v-38.9h77.8V395h-0.2c0.7,84.6,69.6,153.1,154.3,153.1S653.4,479.6,654.1,395h-0.2v-38.9h77.8V395H693.2z M772.5,661.7c-42.9,0-77.8,34.8-77.8,77.8c0,42.9,34.8,77.8,77.8,77.8c42.9,0,77.8-34.8,77.8-77.8C850.3,696.5,815.5,661.7,772.5,661.7z M772.5,778.3c-21.5,0-38.9-17.4-38.9-38.9c0-21.5,17.4-38.9,38.9-38.9c21.5,0,38.9,17.4,38.9,38.9C811.4,760.9,794,778.3,772.5,778.3z"></path>
                    </g>
                </g>
            </svg>
          </a>
          <!-- A span element for styling purposes -->
          <span>.</span>
        </div>
        <!-- Navigation icon section with an onClick event listener -->
        <div class="nav__icon" onClick="handleClick()">
          <!-- Font Awesome icon for bars (hamburger menu) -->
          <i class="fa fa-bars"></i>
        </div>

        <!-- Unordered list for navigation links with 'active' class -->
        <ul class="nav__links active">
          <!-- List item for the 'Home' link -->
          <li class="link">
            <a href="../Landing_Page/LandingPage.html">Home</a>
          </li>
          <!-- List item for the 'Appointments' link -->
          <li class="link">
            <a href="#">Appointments</a>
          </li>
          <!-- List item for the 'Sign Up' link with a button -->
          <li class="link">
            <a href="../Sign_Up/Sign_Up.html">
              <button class="btn1">Sign Up</button>
            </a>
          </li>
          <!-- List item for the 'Login' link with a button -->
          <li class="link">
            <a href="../Login/Login.html">
              <button class="btn1">Login</button>
            </a>
          </li>
        </ul>
    </nav>
    <script>
        // Define the handleClick function to toggle the navigation menu
        function handleClick() {
            const navLinks = document.querySelector(".nav__links");
            const navIcon = document.querySelector(".nav__icon i");

            // Toggle the 'active' class on the navigation links
            navLinks.classList.toggle("active");

            // Toggle the Font Awesome icons (bars and times)
            if (navLinks.classList.contains("active")) {
                navIcon.classList.remove("fa-bars");
                navIcon.classList.add("fa-times");
            } else {
                navIcon.classList.remove("fa-times");
                navIcon.classList.add("fa-bars");
            }
        }
    </script>
</body>
</html>
